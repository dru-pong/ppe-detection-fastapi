<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captured Faces - PPE Detection System</title>
    <link href="/static/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="gallery-header text-center">
        <div class="container">
            <h1><i class="fas fa-user me-2"></i>Captured Faces</h1>
            <p class="lead">Faces detected during PPE violations</p>
            <a href="/" class="btn btn-light">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
    </div>
    
    <div class="container">
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group search-box">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" class="form-control" placeholder="Search by date or time..." id="searchInput">
                </div>
            </div>
            <div class="col-md-6 text-end">
                <span class="badge bg-primary">
                    {{ face_images|length }} Faces Captured
                </span>
            </div>
        </div>
        
        <div class="row" id="faceGallery">
            {% for face in face_images %}
            <div class="col-md-4 col-lg-20">
                <div class="face-card">
                    <img src="{{ face.url }}" alt="Captured Face">
                    <div class="face-info">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge badge-violation text-white">
                                <i class="fas fa-exclamation-triangle me-1"></i>Violation
                            </span>
                            <button class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                        <div class="timestamp mt-2">
                            <i class="far fa-clock me-1"></i>{{ face.timestamp }}
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="text-center mt-4">
            <button class="btn btn-primary" id="loadMore">
                <i class="fas fa-plus me-2"></i>Load More
            </button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // You can insert your JavaScript here (search, load more, etc.)
    </script>
</body>
</html>
